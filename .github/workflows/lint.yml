name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3-yaml

      - name: Lint everything
        run: bash scripts/lint-all.sh
