name: Bump Ollama

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare current and latest Ollama versions
        id: versions
        run: |
          CURRENT="$(bash scripts/ollama-version.sh current)"
          LATEST="$(bash scripts/ollama-version.sh latest)"
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          if [[ "${CURRENT}" == "${LATEST}" ]]; then
            echo "update_needed=false" >> "${GITHUB_OUTPUT}"
            echo "Already on latest Ollama Docker image (${CURRENT})."
          else
            echo "update_needed=true" >> "${GITHUB_OUTPUT}"
            echo "Update available: ${CURRENT} -> ${LATEST}"
          fi

      - name: Update compose file and docs
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          CURRENT="${{ steps.versions.outputs.current }}"
          LATEST="${{ steps.versions.outputs.latest }}"
          sed -i "s|ollama/ollama:${CURRENT}|ollama/ollama:${LATEST}|g" docker-compose.yml
          sed -i "s|ollama/ollama:${CURRENT}|ollama/ollama:${LATEST}|g" README.md
          if [[ -f docs/features/ollama-docker.md ]]; then
            sed -i "s|ollama/ollama:${CURRENT}|ollama/ollama:${LATEST}|g" docs/features/ollama-docker.md
          fi
          if [[ -f docs/features/auto-updates.md ]]; then
            sed -i "s|ollama/ollama:${CURRENT}|ollama/ollama:${LATEST}|g" docs/features/auto-updates.md
          fi

      - name: Create pull request
        if: steps.versions.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/ollama-${{ steps.versions.outputs.latest }}
          title: Bump Ollama to ${{ steps.versions.outputs.latest }}
          commit-message: Bump Ollama to ${{ steps.versions.outputs.latest }}
          body: |
            Automated weekly bump to the latest stable Ollama release (`ollama/ollama` Docker image).

            - **Current:** ${{ steps.versions.outputs.current }}
            - **Latest:** ${{ steps.versions.outputs.latest }}

            This PR will be merged automatically after CI passes.
          labels: automerge
          add-paths: |
            docker-compose.yml
            README.md
            docs/features/ollama-docker.md
            docs/features/auto-updates.md
